# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: claude
    main: ./cmd/claude
    binary: claude
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      # Inject the released version into bootstrap.appVersion (the ldflags
      # override point declared in internal/bootstrap/bootstrap.go). Before
      # v0.8.0 this targeted a nonexistent `main.version`, so released
      # binaries all printed the build-time default "0.1.0".
      - -X github.com/tunsuy/claude-code-go/internal/bootstrap.appVersion={{.Version}}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch
  groups:
    - title: "🚀 Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "📚 Documentation"
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: "🔧 Maintenance"
      order: 999

release:
  github:
    owner: tunsuy
    name: claude-code-go
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## Claude Code Go {{ .Tag }}

    🤖 A Go reimplementation of Claude Code — AI coding assistant in your terminal.

    ### Installation

    ```bash
    # Via Go
    go install github.com/tunsuy/claude-code-go/cmd/claude@{{ .Tag }}

    # Or download the binary below
    ```
  footer: |
    ---
    **Full Changelog**: https://github.com/tunsuy/claude-code-go/compare/{{ .PreviousTag }}...{{ .Tag }}

# NOTE: no `brews:` section — the previously configured tunsuy/homebrew-tap
# repository does not exist and HOMEBREW_TAP_TOKEN is not set, so every
# release after enabling it would fail at the tap-publish step. Re-add it
# only after creating the tap repo and its token.
